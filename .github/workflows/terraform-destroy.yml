name: Terraform Destroy (GHCR state)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to destroy (main, dev, stg, etc.)'
        required: true
        default: 'main'
      confirm_destroy:
        description: 'Type "DESTROY" to confirm'
        required: true

permissions:
  contents: read
  packages: write

env:
  STATE_IMAGE: ghcr.io/${{ github.repository }}/terraform-state
  STATE_TAG: ${{ github.event.inputs.environment }}
  STATE_BLOB: terraform.tfstate.enc
  TF_VERSION: 1.9.5

jobs:
  terraform-destroy:
    runs-on: ubuntu-latest
    environment: 
      name: destroy-approval
      url: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    defaults:
      run:
        shell: bash
        working-directory: terraform

    steps:
      - name: Validate destroy confirmation
        run: |
          if [ "${{ github.event.inputs.confirm_destroy }}" != "DESTROY" ]; then
            echo "ERROR: Must type 'DESTROY' to confirm destruction"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Install oras
        run: |
          set -euxo pipefail
          ORAS_VERSION=1.2.0
          curl -sL "https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/oras_${ORAS_VERSION}_linux_amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin oras
          oras version

      - name: Pull existing encrypted state from GHCR
        env:
          REF: ${{ env.STATE_IMAGE }}:${{ env.STATE_TAG }}
        run: |
          set -e
          mkdir -p .tfstate_store
          if oras manifest fetch "$REF" >/dev/null 2>&1; then
            oras pull "$REF" -o .tfstate_store
          else
            echo "No state found for environment ${{ env.STATE_TAG }}"
            exit 1
          fi

      - name: Decrypt state
        if: hashFiles('.tfstate_store/${{ env.STATE_BLOB }}') != ''
        env:
          STATE_PASSPHRASE: ${{ secrets.STATE_PASSPHRASE }}
        run: |
          openssl enc -d -aes-256-cbc -md sha256 \
            -in ".tfstate_store/${STATE_BLOB}" \
            -out terraform.tfstate \
            -pass pass:"${STATE_PASSPHRASE}"

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform destroy plan
        run: terraform plan -destroy -input=false -out=destroy.tfplan

      - name: Terraform destroy
        run: terraform apply -input=false -auto-approve destroy.tfplan

      - name: Encrypt empty state
        env:
          STATE_PASSPHRASE: ${{ secrets.STATE_PASSPHRASE }}
        run: |
          mkdir -p .tfstate_store
          if [ -s terraform.tfstate ]; then
            openssl enc -e -aes-256-cbc -md sha256 \
              -in terraform.tfstate \
              -out ".tfstate_store/${STATE_BLOB}" \
              -pass pass:"${STATE_PASSPHRASE}"
          fi

      - name: Login to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "${GITHUB_TOKEN}" | oras login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

      - name: Push updated state to GHCR
        if: hashFiles('.tfstate_store/${{ env.STATE_BLOB }}') != ''
        env:
          REF: ${{ env.STATE_IMAGE }}:${{ env.STATE_TAG }}
        run: |
          oras push "$REF" \
            --artifact-type application/vnd.terraform.state.encrypted \
            ".tfstate_store/${STATE_BLOB}:application/octet-stream"